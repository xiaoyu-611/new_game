<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>答应啦 💖</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            min-height:100vh;
            background: linear-gradient(135deg, #ffd6e0, #ffb6c1);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            font-family:"Microsoft Yahei",sans-serif;
            overflow:hidden;
        }
        .title{
            font-size:42px;
            color:#c82350;
            margin-bottom:16px;
            z-index:10;
            text-align:center;
        }
        .sub{
            font-size:20px;
            color:#991b40;
            z-index:10;
            text-align:center;
            margin-bottom: 40px;
        }
        .restart-btn{
            z-index:10;
            padding:14px 32px;
            border:none;
            border-radius: 999px;
            background-color: #c82350;
            color:#fff;
            font-size:18px;
            cursor:pointer;
            transition: 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .restart-btn:hover{
            background-color: #a01c3f;
            transform: scale(1.05);
        }
        .heart{
            position:fixed;
            pointer-events:none;
            animation: fall linear forwards;
        }
        @keyframes fall{
            0%{
                opacity:1;
                transform:translateY(-20px) rotate(0deg);
            }
            100%{
                opacity:0;
                transform:translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>
<body>
<div class="title">太好了！🥰</div>
<div class="sub">一起去约会吧！</div>
<button class="restart-btn" onclick="location.href='home8.html'">再玩一次</button>

<script>
    const hearts = ["❤️","💕","💗","💖","💓","💘"];
    function createHeart(){
        const el = document.createElement("div");
        el.className = "heart";
        el.innerText = hearts[Math.floor(Math.random()*hearts.length)];
        el.style.left = Math.random()*100 + "vw";
        el.style.fontSize = (Math.random()*24+16)+"px";
        const dur = Math.random()*3+2;
        el.style.animationDuration = dur + "s";
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),dur*1000);
    }
    setInterval(createHeart,120);
</script>
</body>
</html>
